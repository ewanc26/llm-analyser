name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt black==24.3.0 isort==5.13.2
      - name: Compile
        run: python -m compileall -q main.py src
      - name: black
        run: black --check main.py src
      - name: isort
        run: isort --check-only main.py src
      - name: CLI smoke test
        run: python main.py --help
